[project]
name = "txtcf"
version = "0.1.0"
description = "Composable framework for comparing versions of a text across classes of metric."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "levenshtein>=0.27.4",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "scipy>=1.18.1",
    "sentence-transformers>=6.0.1",
    "textstat>=0.7.13",
]

[project.optional-dependencies]
# Azure AI Foundry embedding backend (embedding_cosine_te3l). Install with: --extra azure
azure = [
    "openai>=2.0",
]
# The predictability (surprisal) metric needs a causal LM backend; keep it optional so
# the core library stays light. Install with: uv sync --extra surprisal
surprisal = [
    "psycholing-metrics>=2.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/txtcf"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
